<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>Life Day Flip Calendar</title>
<style>
  :root {
    color-scheme: dark;
    --page-bg: transparent;
    --card: #202124;
    --card-2: #1b1c1f;
    --text: #f5f5f7;
    --muted: rgba(245,245,247,.56);
    --line: rgba(255,255,255,.10);
    --shadow: 0 18px 50px rgba(0,0,0,.28);
  }

  * { box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
    margin: 0;
    background: var(--page-bg);
    overflow: hidden;
  }

  body {
    display: grid;
    place-items: center;
    padding: 14px;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text",
                 "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    text-rendering: geometricPrecision;
  }

  .widget {
    width: min(100%, 560px);
    display: grid;
    gap: 10px;
    justify-items: center;
  }

  .eyebrow {
    font-size: clamp(11px, 2.2vw, 13px);
    line-height: 1;
    letter-spacing: .08em;
    color: var(--muted);
    font-weight: 560;
    white-space: nowrap;
    user-select: none;
  }

  .calendar {
    position: relative;
    width: min(100%, 360px);
    aspect-ratio: 1.9 / 1;
    perspective: 1100px;
    filter: drop-shadow(var(--shadow));
  }

  .sheet,
  .flap {
    position: absolute;
    left: 0;
    width: 100%;
    height: 50%;
    overflow: hidden;
    display: grid;
    place-items: center;
    background: var(--card);
    color: var(--text);
    backface-visibility: hidden;
  }

  .sheet.top {
    top: 0;
    border-radius: 18px 18px 5px 5px;
    border-bottom: 1px solid var(--line);
  }

  .sheet.bottom {
    bottom: 0;
    border-radius: 5px 5px 18px 18px;
    background: var(--card-2);
    border-top: 1px solid rgba(0,0,0,.28);
  }

  .number {
    position: absolute;
    left: 50%;
    width: 100%;
    transform: translateX(-50%);
    text-align: center;
    font-variant-numeric: tabular-nums;
    font-feature-settings: "tnum" 1, "kern" 1;
    font-weight: 690;
    letter-spacing: -.065em;
    font-size: clamp(72px, 24vw, 128px);
    line-height: 1;
  }

  .top .number { top: 50%; transform: translate(-50%, -50%); }
  .bottom .number { bottom: 50%; transform: translate(-50%, 50%); }

  .flap {
    top: 0;
    transform-origin: center bottom;
    border-radius: 18px 18px 5px 5px;
    z-index: 4;
    border-bottom: 1px solid var(--line);
  }

  .flap .number { top: 50%; transform: translate(-50%, -50%); }

  .flap.animate {
    animation: flipDown 720ms cubic-bezier(.22,.61,.36,1) both;
  }

  .hinge {
    position: absolute;
    z-index: 8;
    left: 50%;
    top: 50%;
    width: 96%;
    height: 1px;
    transform: translate(-50%, -50%);
    background: rgba(255,255,255,.08);
    pointer-events: none;
  }

  .pin {
    position: absolute;
    z-index: 9;
    top: 50%;
    width: 7px;
    height: 14px;
    border-radius: 999px;
    transform: translateY(-50%);
    background: #0f1012;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.08);
  }

  .pin.left { left: 9px; }
  .pin.right { right: 9px; }

  .caption {
    display: flex;
    align-items: baseline;
    gap: 7px;
    color: var(--muted);
    user-select: none;
  }

  .caption strong {
    color: rgba(245,245,247,.9);
    font-size: clamp(12px, 2.5vw, 14px);
    font-weight: 620;
    letter-spacing: .02em;
  }

  .caption span {
    font-size: clamp(10px, 2.1vw, 12px);
    letter-spacing: .08em;
    text-transform: uppercase;
  }

  @keyframes flipDown {
    0%   { transform: rotateX(0deg); filter: brightness(1); }
    45%  { transform: rotateX(-90deg); filter: brightness(.72); }
    100% { transform: rotateX(-180deg); filter: brightness(.58); }
  }

  @media (prefers-reduced-motion: reduce) {
    .flap.animate { animation: none; }
  }

  @media (max-height: 220px) {
    body { padding: 8px; }
    .widget { gap: 6px; }
    .calendar { width: min(100%, 300px); }
    .eyebrow { font-size: 10px; }
    .caption strong { font-size: 11px; }
    .caption span { font-size: 9px; }
  }
</style>
</head>
<body>
  <main class="widget" aria-label="正向计日翻页日历">
    <div class="eyebrow" id="sinceLabel">始于 2026.03.12</div>

    <div class="calendar" aria-live="polite">
      <div class="sheet top"><div class="number" id="topNumber">208</div></div>
      <div class="sheet bottom"><div class="number" id="bottomNumber">208</div></div>
      <div class="flap" id="flap"><div class="number" id="flapNumber">207</div></div>
      <div class="hinge"></div>
      <div class="pin left"></div>
      <div class="pin right"></div>
    </div>

    <div class="caption"><strong id="statusText">已经</strong><span id="unitText">DAYS</span></div>
  </main>

<script>
(() => {
  const params = new URLSearchParams(location.search);

  // 默认设置。也可以通过 URL 参数覆盖：
  // ?start=2026-03-12&label=始于%202026.03.12&unit=DAYS&status=已经
  const start = params.get('start') || '2026-03-12';
  const customLabel = params.get('label');
  const unit = params.get('unit') || 'DAYS';
  const status = params.get('status') || '已经';

  const parseISODate = (iso) => {
    const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(iso);
    if (!m) return null;
    return { y: +m[1], m: +m[2], d: +m[3] };
  };

  const dayNumberUTC = (y, m, d) => Date.UTC(y, m - 1, d) / 86400000;

  const elapsedDays = () => {
    const s = parseISODate(start);
    if (!s) return 0;
    const now = new Date();
    const today = dayNumberUTC(now.getFullYear(), now.getMonth() + 1, now.getDate());
    const first = dayNumberUTC(s.y, s.m, s.d);
    return Math.floor(today - first);
  };

  const formatLabel = () => {
    if (customLabel) return customLabel;
    const s = parseISODate(start);
    if (!s) return `始于 ${start}`;
    return `始于 ${s.y}.${String(s.m).padStart(2,'0')}.${String(s.d).padStart(2,'0')}`;
  };

  const topNumber = document.getElementById('topNumber');
  const bottomNumber = document.getElementById('bottomNumber');
  const flap = document.getElementById('flap');
  const flapNumber = document.getElementById('flapNumber');
  const sinceLabel = document.getElementById('sinceLabel');
  const unitText = document.getElementById('unitText');
  const statusText = document.getElementById('statusText');

  sinceLabel.textContent = formatLabel();
  unitText.textContent = unit;
  statusText.textContent = status;

  let current = elapsedDays();

  function render(value, animate = true) {
    const previous = value - 1;
    topNumber.textContent = value;
    bottomNumber.textContent = value;
    flapNumber.textContent = previous;

    flap.classList.remove('animate');
    void flap.offsetWidth;
    if (animate) flap.classList.add('animate');
  }

  render(current, true);

  // 到本地日期跨天时自动更新，无需手动刷新。
  setInterval(() => {
    const next = elapsedDays();
    if (next !== current) {
      current = next;
      render(current, true);
    }
  }, 30000);
})();
</script>
</body>
</html>
